name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Unit & integration tests
        run: npm test
        env:
          PVM_API_SECRET: ${{ secrets.PVM_API_SECRET || 'ci-test-secret-at-least-32-characters-long' }}

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Dependency audit (SAST-lite)
        run: npm audit --audit-level=critical
        continue-on-error: true

  docker:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: pvm:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start container
        run: |
          docker run -d --name pvm-ci -e PVM_API_SECRET=e2e-secret -p 7000:7000 pvm:ci
          for i in $(seq 1 30); do
            curl -sf http://localhost:7000/api/health && break
            sleep 1
          done

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cypress E2E
        run: npx cypress run --project apps/web --browser electron
        env:
          PVM_E2E_BASE_URL: http://localhost:7000
          PVM_API_SECRET: e2e-secret

      - name: Container logs (on failure)
        if: failure()
        run: docker logs pvm-ci
