name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Create release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Read version
        id: version
        run: |
          echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          echo "name=$(python -c "import json;print(json.load(open('custom_components/pvm/manifest.json'))['name'])")" >> "$GITHUB_OUTPUT"
      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          body="Änderungen siehe [CHANGELOG.md](https://github.com/Dealwirth/PVM/blob/$TAG/CHANGELOG.md)."
          gh release create "$TAG" \
            --title "$TAG" \
            --notes "$body" \
            --generate-notes 2>/dev/null || gh release create "$TAG" --title "$TAG" --notes "$body"
